<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carrinho - Link Corp</title><link rel="stylesheet" href="style.css"></head><body><div id="nav"></div><main class="section container"><h1 class="title">FINALIZAR <span class="glow">PEDIDO</span></h1><div class="admin-layout"><div class="card"><h2>Seu carrinho</h2><div id="cartFull"></div><h2>Total: <span id="total" class="glow">R$ 0,00</span></h2><button class="btn ghost" onclick="localStorage.removeItem('cart');renderCart();">Limpar carrinho</button></div><div class="card"><h2>Dados para entrega manual</h2><form id="orderForm" class="form"><input class="input" name="customer_name" placeholder="Seu nome" required><input class="input" name="whatsapp" placeholder="WhatsApp com DDD" required><input class="input" name="email" placeholder="Email opcional"><textarea name="notes" placeholder="Nick, ID ou observação do pedido"></textarea><button class="btn">Gerar pedido e Pix</button></form><div id="pixBox" style="display:none;margin-top:20px" class="card"><h2>Pagamento PIX</h2><p>Chave Pix:</p><input class="input" id="pixKey" readonly><button class="btn" onclick="navigator.clipboard.writeText(cfg.PIX_KEY);toast('Pix copiado!')">Copiar Pix</button><p>Depois de pagar, envie o comprovante pelo WhatsApp.</p><a id="wppBtn" class="btn" target="_blank">Enviar comprovante</a></div></div></div></main><div id="footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script src="app.js"></script><script>boot('produtos');function renderCart(){let c=JSON.parse(localStorage.getItem('cart')||'[]');document.getElementById('cartFull').innerHTML=c.length?c.map((i,k)=>`<div class="plan"><b>${i.name}</b><span>${i.plan}</span><b>${money(i.price)}</b></div>`).join(''):'<p>Carrinho vazio.</p>';document.getElementById('total').textContent=money(c.reduce((s,i)=>s+Number(i.price||0),0))}renderCart();document.getElementById('orderForm').onsubmit=async e=>{e.preventDefault();let cart=JSON.parse(localStorage.getItem('cart')||'[]');if(!cart.length)return toast('Seu carrinho está vazio');let fd=new FormData(e.target);let order={customer_name:fd.get('customer_name'),whatsapp:fd.get('whatsapp'),email:fd.get('email'),notes:fd.get('notes'),items:cart,total:cart.reduce((s,i)=>s+Number(i.price||0),0),status:'pendente'};if(isConfigured()){let {error}=await supabase.from('orders').insert(order);if(error)return toast('Erro: '+error.message)}document.getElementById('pixBox').style.display='block';document.getElementById('pixKey').value=cfg.PIX_KEY;let msg=encodeURIComponent(`Olá, fiz um pedido na Link Corp. Total: ${money(order.total)}. Nome: ${order.customer_name}. Vou enviar o comprovante.`);document.getElementById('wppBtn').href=`https://wa.me/${cfg.WHATSAPP_NUMBER}?text=${msg}`;toast('Pedido gerado! Agora pague no Pix.');}</script></body></html>
