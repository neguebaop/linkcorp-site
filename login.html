<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Link Corp</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-switch{color:#ff3131;text-shadow:0 0 18px #ff2020;font-family:inherit;font-weight:800;cursor:pointer;text-decoration:none}
    .login-switch:hover{text-decoration:underline}
    #registerBox{display:none}
    .login-alert{position:fixed;right:18px;bottom:18px;background:#141b28;border:1px solid #ff3131;color:#fff;padding:14px 18px;border-radius:12px;box-shadow:0 0 25px rgba(255,49,49,.35);z-index:9999;display:none;max-width:360px}
    .login-alert.show{display:block}
  </style>
</head>
<body>
<div id="nav"></div>

<main class="section container">
  <div class="admin-layout" style="align-items:center;min-height:620px">
    <div>
      <img class="hero-logo" src="assets/logo.png" alt="Link Corp">
      <h1>BEM-VINDO A <span class="glow">LINK CORP</span></h1>
      <p class="subtitle">Entre na sua conta para continuar.</p>
      <p>🛡️ Pagamento 100% seguro</p>
      <p>⚡ Entrega manual após pagamento</p>
      <p>🏅 Suporte premium 24/7</p>
    </div>

    <div class="card" id="loginBox">
      <h2 style="text-align:center">ENTRAR</h2>
      <form id="loginForm" class="form" autocomplete="on">
        <input class="input" name="email" type="email" placeholder="Email" required>
        <input class="input" name="password" type="password" placeholder="Senha" required>
        <button class="btn" type="submit">ENTRAR</button>
      </form>
      <p style="text-align:center">Não tem conta? <a class="login-switch" href="javascript:void(0)" onclick="return showRegister()">Criar conta</a></p>
      <hr>
      <p style="text-align:center"><a href="admin.html">Área admin</a></p>
    </div>

    <div class="card" id="registerBox">
      <h2 style="text-align:center">CRIAR CONTA</h2>
      <form id="registerForm" class="form" autocomplete="on">
        <input class="input" name="email" type="email" placeholder="Email" required>
        <input class="input" name="password" type="password" placeholder="Senha mínimo 6 caracteres" minlength="6" required>
        <button class="btn" type="submit">CRIAR CONTA</button>
      </form>
      <p style="text-align:center">Já tem conta? <a class="login-switch" href="javascript:void(0)" onclick="return showLogin()">Entrar</a></p>
    </div>
  </div>
</main>

<div id="footer"></div>
<div id="loginAlert" class="login-alert"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>
<script>
function showRegister(){document.getElementById('loginBox').style.display='none';document.getElementById('registerBox').style.display='block';return false;}
function showLogin(){document.getElementById('registerBox').style.display='none';document.getElementById('loginBox').style.display='block';return false;}
function loginMsg(msg){let t=document.getElementById('loginAlert')||document.getElementById('toast'); if(!t){alert(msg);return;} t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500);}

boot('login');
(async()=>{ const session=await getSession(); if(session && session.user){ location.href='conta.html'; } })();

document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  if(!isConfigured()) return loginMsg('Configure SUPABASE_URL e SUPABASE_ANON_KEY no config.js primeiro.');
  const fd=new FormData(e.target);
  const result=await supabase.auth.signInWithPassword({email:fd.get('email'),password:fd.get('password')});
  if(result.error) return loginMsg(result.error.message);
  localStorage.setItem('linkcorp_user_email', fd.get('email'));
  loginMsg('Login feito!');
  setTimeout(()=>location.href='conta.html',700);
});

document.getElementById('registerForm').addEventListener('submit', async function(e){
  e.preventDefault();
  if(!isConfigured()) return loginMsg('Configure SUPABASE_URL e SUPABASE_ANON_KEY no config.js primeiro.');
  const fd=new FormData(e.target);
  const result=await supabase.auth.signUp({email:fd.get('email'),password:fd.get('password')});
  if(result.error) return loginMsg(result.error.message);
  localStorage.setItem('linkcorp_user_email', fd.get('email'));
  loginMsg('Conta criada! Agora entre com seu email e senha.');
  showLogin();
  document.querySelector('#loginForm [name=email]').value=fd.get('email');
});
</script>
</body>
</html>
