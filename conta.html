<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Minha conta - Link Corp</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .account-top{border-bottom:1px solid rgba(255,255,255,.08);background:#08090c;position:sticky;top:0;z-index:4}
    .account-hero{max-width:1120px;margin:0 auto;padding:35px 20px 10px;text-align:center}
    .banner{border:1px solid rgba(184,53,255,.55);background:linear-gradient(135deg,rgba(65,0,95,.55),rgba(12,12,18,.95));border-radius:18px;padding:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:20px auto;box-shadow:0 0 28px rgba(186,48,255,.18)}
    .banner img{width:100%;height:140px;object-fit:cover;border-radius:12px;border:1px solid rgba(255,49,49,.25)}
    .profile-layout{max-width:1120px;margin:30px auto;display:grid;grid-template-columns:230px 1fr;gap:35px;padding:0 20px}
    .side-card{padding:25px;border-radius:18px;background:rgba(15,18,27,.65);border:1px solid rgba(255,255,255,.08)}
    .avatar-big{width:78px;height:78px;border-radius:50%;background:#eee;color:#333;display:flex;align-items:center;justify-content:center;font-size:42px;margin-bottom:14px}
    .side-link{display:block;padding:13px 14px;border-left:3px solid transparent;color:#fff;text-decoration:none;margin-top:8px;background:rgba(255,255,255,.02)}
    .side-link.active{border-left-color:#ffbd3a;background:rgba(255,189,58,.08)}
    .empty-box{min-height:360px;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;color:#aaa}
    .empty-box .icon{font-size:68px;color:#777;margin-bottom:12px}
    .user-pill{display:inline-flex;gap:7px;align-items:center}.avatar-mini{background:#fff;color:#222;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center}
    @media(max-width:800px){.banner{grid-template-columns:1fr}.profile-layout{grid-template-columns:1fr}.banner img{height:180px}}
  </style>
</head>
<body class="grid-bg">
<div id="nav"></div>
<main>
  <section class="account-hero">
    <h3>WELCOME <span id="welcomeName">LINK CORP</span></h3>
    <div class="banner">
      <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=900&auto=format&fit=crop" alt="banner">
      <img src="https://images.unsplash.com/photo-1593305841991-05c297ba4575?q=80&w=900&auto=format&fit=crop" alt="banner">
      <img src="https://images.unsplash.com/photo-1607252650355-f7fd0460ccdb?q=80&w=900&auto=format&fit=crop" alt="banner">
    </div>
  </section>

  <section class="profile-layout">
    <aside class="side-card">
      <div class="avatar-big">👤</div>
      <h3 id="userName">Usuário</h3>
      <p class="subtitle">Sua conta pessoal</p>
      <a class="side-link active" href="conta.html">Compras</a>
      <a class="side-link" href="produtos.html">Buscar produtos</a>
      <a class="side-link" href="javascript:void(0)" onclick="logout()">Sair</a>
    </aside>
    <div>
      <h2>Minhas Compras</h2>
      <p class="subtitle">Todas suas compras efetuadas</p>
      <div class="empty-box card">
        <div class="icon">〰️</div>
        <p>Você ainda não tem nenhuma compra no momento 🥲</p>
        <a class="btn" href="produtos.html">Buscar produtos</a>
      </div>
    </div>
  </section>
</main>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>
<script>
boot('conta');
(async()=>{
  const session=await getSession();
  if(!session || !session.user){ location.href='login.html'; return; }
  const email=session.user.email||'usuario@email.com';
  const name=email.split('@')[0];
  document.getElementById('userName').innerHTML=name+' ✅';
  document.getElementById('welcomeName').textContent=name.toUpperCase();
})();
</script>
</body>
</html>
