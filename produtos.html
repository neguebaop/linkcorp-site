<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos - Link Corp</title><link rel="stylesheet" href="style.css">
<style>
.buy-plan-list{display:grid;gap:12px;margin:18px 0}
.buy-plan-option{border:1px solid rgba(255,49,49,.35);background:#121b2a;border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;transition:.2s}
.buy-plan-option:hover,.buy-plan-option.active{border-color:#ff3131;box-shadow:0 0 24px rgba(255,49,49,.25);transform:translateY(-2px)}
.buy-plan-left b{display:block;font-size:18px;color:white}
.buy-plan-left small{color:#95a0b4}
.buy-plan-discount{background:#064f36;color:#00ff9d;border-radius:8px;padding:4px 8px;font-weight:900;margin-left:8px}
.buy-plan-price{text-align:right}
.buy-plan-price del{display:block;color:#858b9a;font-size:13px}
.buy-plan-price strong{color:#fff;font-size:24px}
</style>


<style>
.buy-modal-box{max-width:1100px;text-align:left}.buy-modal-top{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:start}.buy-modal-img{width:100%;border-radius:14px;border:1px solid rgba(255,49,49,.35);max-height:330px;object-fit:cover}.discord-badge{background:#064f36;color:#00ff9d;border-radius:8px;padding:8px 12px;font-weight:900}.buy-description{line-height:1.55}.buy-plan-list{display:grid;gap:12px;margin:18px 0}.buy-plan-option{border:1px solid rgba(255,49,49,.35);background:#121b2a;border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;transition:.2s}.buy-plan-option:hover,.buy-plan-option.active{border-color:#ff3131;box-shadow:0 0 24px rgba(255,49,49,.25);transform:translateY(-2px)}.buy-plan-left b{display:block;font-size:18px;color:white}.buy-plan-left small{color:#95a0b4}.buy-plan-discount{background:#064f36;color:#00ff9d;border-radius:8px;padding:4px 8px;font-weight:900;margin-left:8px}.buy-plan-price{text-align:right}.buy-plan-price del{display:block;color:#858b9a;font-size:13px}.buy-plan-price strong{color:#fff;font-size:24px}.buy-stock-card{margin-top:18px}
@media(max-width:800px){.buy-modal-top{grid-template-columns:1fr}.buy-modal-box{max-height:92vh;overflow:auto}}
</style>
</head><body><div id="nav"></div><main class="section container"><h1 class="title">NOSSOS <span class="glow">PRODUTOS</span></h1><p class="muted">Escolha a categoria e o produto perfeito</p><div class="tabs"><button class="tab active" data-cat="all">🔥 Todos</button><button class="tab" data-cat="android">🤖 Android</button><button class="tab" data-cat="ios">🍎 iOS</button><button class="tab" data-cat="pc">💻 PC</button></div><h2>🔥 TOP MAIS PROCURADOS 🔥</h2><div id="grid" class="products-grid"></div><h2 style="margin-top:55px">📦 PLANOS COMPLETOS</h2><div id="wide"></div><div class="cta"><h2>TEM DÚVIDAS?</h2><p class="muted">Nossa equipe está disponível para ajudar você</p><button class="btn" onclick="window.open(DISCORD_URL,'_blank')">ENTRAR NO DISCORD</button></div></main><div id="footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script src="app.js"></script><script>boot('produtos');let products=[];async function load(){products=await fetchProducts();window.LINKCORP_PRODUCTS=products;render('all')}function render(cat){document.getElementById('grid').innerHTML=products.filter(p=>cat==='all'||p.category===cat).map(productCard).join('')||'<p>Nenhum produto cadastrado nessa categoria.</p>';document.getElementById('wide').innerHTML=products.filter(p=>cat==='all'||p.category===cat).map(productWide).join('')}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.cat)});load();</script>


</body></html>
