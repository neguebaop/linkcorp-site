<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos - Link Corp</title><link rel="stylesheet" href="style.css"></head><body><div id="nav"></div><main class="section container"><h1 class="title">NOSSOS <span class="glow">PRODUTOS</span></h1><p class="muted">Escolha a categoria e o produto perfeito</p><div class="tabs"><button class="tab active" data-cat="all">🔥 Todos</button><button class="tab" data-cat="android">🤖 Android</button><button class="tab" data-cat="ios">🍎 iOS</button><button class="tab" data-cat="pc">💻 PC</button></div><h2>🔥 TOP MAIS PROCURADOS 🔥</h2><div id="grid" class="products-grid"></div><h2 style="margin-top:55px">📦 PLANOS COMPLETOS</h2><div id="wide"></div><div class="cta"><h2>TEM DÚVIDAS?</h2><p class="muted">Nossa equipe está disponível para ajudar você</p><button class="btn" onclick="window.open('https://wa.me/'+cfg.WHATSAPP_NUMBER,'_blank')">FALAR COM SUPORTE</button></div></main><div id="footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script src="app.js"></script><script>boot('produtos');let products=[];async function load(){products=await fetchProducts();render('all')}function render(cat){document.getElementById('grid').innerHTML=products.filter(p=>cat==='all'||p.category===cat).map(productCard).join('')||'<p>Nenhum produto cadastrado nessa categoria.</p>';document.getElementById('wide').innerHTML=products.filter(p=>cat==='all'||p.category===cat).map(productWide).join('')}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.cat)});load();</script></body></html>
