<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Link Corp</title><link rel="stylesheet" href="style.css"></head><body><div id="nav"></div><main class="section container"><h1 class="title">PAINEL <span class="glow">ADMIN</span></h1><div id="loginAdmin" class="card" style="max-width:520px;margin:auto"><h2>Entrar como admin</h2><form id="adminLogin" class="form"><input class="input" type="email" name="email" placeholder="Email admin"><input class="input" type="password" name="password" placeholder="Senha"><button class="btn">Entrar</button></form></div><div id="adminArea" style="display:none"><div class="admin-layout"><div class="card"><h2>Cadastrar produto</h2><form id="productForm" class="form"><input type="hidden" name="id"><select name="category" required><option value="android">Android</option><option value="ios">iOS</option><option value="pc">PC</option></select><input class="input" name="name" placeholder="Nome do produto" required><textarea name="description" placeholder="Descrição"></textarea><input class="input" name="badge" placeholder="Selo ex: Mais escolhido"><input class="input" name="old_price" type="number" step="0.01" placeholder="Preço antigo"><input class="input" name="price" type="number" step="0.01" placeholder="Preço principal"><input class="input" name="image_url" placeholder="URL da imagem ou envie arquivo abaixo"><input class="input" name="image_file" type="file" accept="image/*">
<div class="card" style="padding:14px">
<h3>Plano do Produto</h3>
<input class="input" name="plan_name" placeholder="Nome do plano ex: 30 Dias">
<input class="input" name="plan_days" placeholder="Duração ex: 30 dias">
<input class="input" name="plan_old_price" type="number" step="0.01" placeholder="Preço antigo">
<input class="input" name="plan_price" type="number" step="0.01" placeholder="Preço promocional">
<input class="input" name="plan_discount" placeholder="Desconto ex: -30%">
</div>
<button class="btn">Salvar produto</button><button type="button" class="btn ghost" onclick="document.getElementById('productForm').reset()">Limpar</button></form></div><div class="card"><h2>Produtos cadastrados</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Imagem</th><th>Nome</th><th>Categoria</th><th>Preço</th><th>Ações</th></tr></thead><tbody id="productsTable"></tbody></table></div><h2>Pedidos</h2><div id="orders"></div></div></div></div></main><div id="footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script src="app.js"></script><script>boot('login');let allProducts=[];async function check(){let s=await getSession();if(s&&isAdminEmail(s.user.email)){document.getElementById('loginAdmin').style.display='none';document.getElementById('adminArea').style.display='block';loadAdmin()}else if(s){toast('Seu email não está em ADMIN_EMAILS no config.js')}}check();document.getElementById('adminLogin').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target);let {error}=await supabase.auth.signInWithPassword({email:fd.get('email'),password:fd.get('password')});if(error)return toast(error.message);check()};async function loadAdmin(){if(!isConfigured())return toast('Configure o Supabase primeiro.');let {data,error}=await supabase.from('products').select('*').order('created_at',{ascending:false});if(error)return toast(error.message);allProducts=data||[];document.getElementById('productsTable').innerHTML=allProducts.map(p=>`<tr><td><img src="${p.image_url||''}"></td><td>${p.name}</td><td>${p.category}</td><td>${money(p.price)}</td><td><button class="tab" onclick="editProduct('${p.id}')">Editar</button> <button class="tab" onclick="delProduct('${p.id}')">Apagar</button></td></tr>`).join('');let r=await supabase.from('orders').select('*').order('created_at',{ascending:false}).limit(20);document.getElementById('orders').innerHTML=(r.data||[]).map(o=>`<div class="plan"><b>${o.customer_name}</b><span>${o.whatsapp}</span><b>${money(o.total)}</b><small>${o.status}</small></div>`).join('')||'<p>Nenhum pedido.</p>'}document.getElementById('productForm').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target);let image=fd.get('image_url');let file=fd.get('image_file');try{if(file&&file.size)image=await uploadImage(file);let plans=[{name:fd.get('plan_name')||'Plano Principal',days:fd.get('plan_days')||'',old_price:Number(fd.get('plan_old_price')||0),price:Number(fd.get('plan_price')||0),discount:fd.get('plan_discount')||''}];let product={category:fd.get('category'),name:fd.get('name'),description:fd.get('description'),badge:fd.get('badge'),old_price:Number(fd.get('old_price')||0),price:Number(fd.get('price')||0),image_url:image,plans,active:true};let id=fd.get('id');let res=id?await supabase.from('products').update(product).eq('id',id):await supabase.from('products').insert(product);if(res.error)return toast(res.error.message);toast('Produto salvo!');e.target.reset();loadAdmin()}catch(err){toast(err.message)}};function editProduct(id){let p=allProducts.find(x=>x.id===id);let f=document.getElementById('productForm');Object.keys(p).forEach(k=>{if(f[k]&&k!=='plans')f[k].value=p[k]??''});f.id.value=p.id;
if(p.plans&&p.plans[0]){
f.plan_name.value=p.plans[0].name||'';
f.plan_days.value=p.plans[0].days||'';
f.plan_old_price.value=p.plans[0].old_price||'';
f.plan_price.value=p.plans[0].price||'';
f.plan_discount.value=p.plans[0].discount||'';
}
scrollTo(0,0)}async function delProduct(id){if(!confirm('Apagar produto?'))return;let {error}=await supabase.from('products').delete().eq('id',id);if(error)return toast(error.message);loadAdmin()}</script></body></html>
