<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Link Corp</title><link rel="stylesheet" href="style.css">
<style>
.variations-box{
  border:1px solid rgba(255,49,49,.45);
  border-radius:20px;
  padding:20px;
  margin-top:20px;
  background:#0f1726;
}
.plan-row{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;
  gap:10px;
  margin-bottom:14px;
  align-items:center;
}
.plan-row input{
  width:100%;
  min-width:0;
  height:48px;
  border-radius:12px;
  border:1px solid #334155;
  background:#18263a;
  color:white;
  padding:0 14px;
  font-size:15px;
}
.plan-remove{
  height:48px;
  width:48px;
  border:none;
  border-radius:12px;
  background:#ff3131;
  color:white;
  font-size:22px;
  cursor:pointer;
}
#addVariationBtn{
  width:100%;
  margin-top:10px;
  height:54px;
  border-radius:14px;
  border:2px solid #ff3131;
  background:transparent;
  color:white;
  font-size:20px;
  font-weight:700;
  cursor:pointer;
}
@media(max-width:900px){
.plan-row{
grid-template-columns:1fr;
}
.plan-remove{
width:100%;
}
}
</style>

<style>
/* FIX FINAL - variações estilo Eremby, grandes e fáceis de digitar */
#legacyPlanBox{display:none!important}
.variations-box{border:1px solid rgba(255,49,49,.65)!important;border-radius:20px!important;padding:22px!important;margin:22px 0!important;background:#101827!important;box-shadow:0 0 22px rgba(255,49,49,.12)!important}
.variations-box h2{margin:0 0 8px!important;font-size:23px!important}
.variations-help{color:#94a3b8!important;margin:0 0 18px!important;line-height:1.45!important}
#variation-container{display:flex!important;flex-direction:column!important;gap:18px!important}
.plan-row{display:grid!important;grid-template-columns:1.3fr 1fr 1fr!important;gap:12px!important;padding:16px!important;border-radius:18px!important;border:1px solid rgba(148,163,184,.35)!important;background:#0b1220!important;margin:0!important}
.plan-row .field{display:flex!important;flex-direction:column!important;gap:6px!important}
.plan-row label{font-size:12px!important;color:#9ca3af!important;font-weight:800!important;text-transform:uppercase!important;letter-spacing:.04em!important}
.plan-row input{display:block!important;width:100%!important;min-width:0!important;height:48px!important;border-radius:12px!important;border:1px solid #334155!important;background:#1e293b!important;color:#fff!important;padding:0 14px!important;font-size:15px!important;box-sizing:border-box!important}
.plan-row input:focus{outline:none!important;border-color:#ff3131!important;box-shadow:0 0 0 3px rgba(255,49,49,.15)!important}
.plan-row .remove-wrap{display:flex!important;align-items:end!important}
.plan-row .plan-remove{height:48px!important;width:100%!important;border:1px solid #ff3131!important;border-radius:12px!important;background:#23111a!important;color:#ff3131!important;font-size:22px!important;font-weight:900!important;cursor:pointer!important}
.plan-row .plan-remove:hover{background:#ff3131!important;color:#fff!important}
#addVariationBtn{display:block!important;width:100%!important;margin-top:18px!important;height:58px!important;border-radius:16px!important;border:2px solid #ff3131!important;background:transparent!important;color:#fff!important;font-size:20px!important;font-weight:900!important;cursor:pointer!important}
#addVariationBtn:hover{background:rgba(255,49,49,.12)!important}
@media(max-width:900px){.plan-row{grid-template-columns:1fr!important}}
</style>
</head><body><div id="nav"></div><main class="section container"><h1 class="title">PAINEL <span class="glow">ADMIN</span></h1><div id="loginAdmin" class="card" style="max-width:520px;margin:auto"><h2>Entrar como admin</h2><form id="adminLogin" class="form"><input class="input" type="email" name="email" placeholder="Email admin"><input class="input" type="password" name="password" placeholder="Senha"><button class="btn">Entrar</button></form></div><div id="adminArea" style="display:none"><div class="admin-layout"><div class="card"><h2>Cadastrar produto</h2><form id="productForm" class="form"><input type="hidden" name="id"><select name="category" required><option value="android">Android</option><option value="ios">iOS</option><option value="pc">PC</option></select><input class="input" name="name" placeholder="Nome do produto" required><textarea name="description" placeholder="Descrição"></textarea><input class="input" name="badge" placeholder="Selo ex: Mais escolhido"><input class="input" name="old_price" type="number" step="0.01" placeholder="Preço antigo"><input class="input" name="price" type="number" step="0.01" placeholder="Preço principal"><input class="input" name="image_url" placeholder="URL da imagem ou envie arquivo abaixo"><input class="input" name="image_file" type="file" accept="image/*">
<div id="legacyPlanBox" class="card" style="padding:14px">
<h3>Plano do Produto</h3>
<input class="input" name="plan_name" placeholder="Nome do plano ex: 30 Dias">
<input class="input" name="plan_days" placeholder="Duração ex: 30 dias">
<input class="input" name="plan_old_price" type="number" step="0.01" placeholder="Preço antigo">
<input class="input" name="plan_price" type="number" step="0.01" placeholder="Preço promocional">
<input class="input" name="plan_discount" placeholder="Desconto ex: -30%">
</div>

<div class="variations-box">
<h2>Variações / Planos</h2>
<p class="variations-help">Cadastre vários planos no mesmo produto. Exemplo: 15 dias, 30 dias, 90 dias, Permanente. O primeiro plano vira o preço principal do card.</p>
<div id="variation-container"></div>
<button type="button" id="addVariationBtn">+ Adicionar plano</button>
</div>
<button class="btn">Salvar produto</button><button type="button" class="btn ghost" onclick="document.getElementById('productForm').reset()">Limpar</button></form></div><div class="card"><h2>Produtos cadastrados</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Imagem</th><th>Nome</th><th>Categoria</th><th>Preço</th><th>Ações</th></tr></thead><tbody id="productsTable"></tbody></table></div><h2>Pedidos</h2><div id="orders"></div></div></div></div></main><div id="footer"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script src="app.js"></script><script>boot('login');let allProducts=[];async function check(){let s=await getSession();if(s&&isAdminEmail(s.user.email)){document.getElementById('loginAdmin').style.display='none';document.getElementById('adminArea').style.display='block';loadAdmin()}else if(s){toast('Seu email não está em ADMIN_EMAILS no config.js')}}check();document.getElementById('adminLogin').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target);let {error}=await supabase.auth.signInWithPassword({email:fd.get('email'),password:fd.get('password')});if(error)return toast(error.message);check()};async function loadAdmin(){if(!isConfigured())return toast('Configure o Supabase primeiro.');let {data,error}=await supabase.from('products').select('*').order('created_at',{ascending:false});if(error)return toast(error.message);allProducts=data||[];document.getElementById('productsTable').innerHTML=allProducts.map(p=>`<tr><td><img src="${p.image_url||''}"></td><td>${p.name}</td><td>${p.category}</td><td>${money(p.price)}</td><td><button class="tab" onclick="editProduct('${p.id}')">Editar</button> <button class="tab" onclick="delProduct('${p.id}')">Apagar</button></td></tr>`).join('');let r=await supabase.from('orders').select('*').order('created_at',{ascending:false}).limit(1000);document.getElementById('orders').innerHTML=(r.data||[]).map(o=>`<div class="plan"><b>${o.customer_name}</b><span>${o.whatsapp}</span><b>${money(o.total)}</b><small>${o.status}</small></div>`).join('')||'<p>Nenhum pedido.</p>'}document.getElementById('productForm').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target);let image=fd.get('image_url');let file=fd.get('image_file');try{if(file&&file.size)image=await uploadImage(file);let plans=collectVariations();if(!plans.length)return toast('Adicione pelo menos 1 plano/variação.');let first=plans[0];let product={category:fd.get('category'),name:fd.get('name'),description:fd.get('description'),badge:fd.get('badge'),old_price:Number(first.old_price||0),price:Number(first.price||0),image_url:image,plans,active:true};let id=fd.get('id');let res=id?await supabase.from('products').update(product).eq('id',id):await supabase.from('products').insert(product);if(res.error)return toast(res.error.message);toast('Produto salvo!');e.target.reset();clearVariations();addVariation();loadAdmin()}catch(err){toast(err.message)}};function editProduct(id){let p=allProducts.find(x=>x.id===id);let f=document.getElementById('productForm');Object.keys(p).forEach(k=>{if(f[k]&&k!=='plans')f[k].value=p[k]??''});f.id.value=p.id;clearVariations();if(p.plans&&p.plans.length){p.plans.forEach(pl=>addVariation(pl));}else{addVariation({name:'Plano Principal',days:'',old_price:p.old_price,price:p.price,discount:''});}scrollTo(0,0)}async function delProduct(id){if(!confirm('Apagar produto?'))return;let {error}=await supabase.from('products').delete().eq('id',id);if(error)return toast(error.message);loadAdmin()}</script>
<script>
setTimeout(()=>{
document.querySelectorAll('.plan-row input').forEach((el,i)=>{
 const placeholders=['Nome do plano','Dias','Preço antigo','Preço atual','Desconto %'];
 if(!el.placeholder) el.placeholder = placeholders[i%5] || 'Campo';
});
},1000);
</script>


<script>
function addVariation(data={}){
const wrap=document.getElementById('variation-container');
if(!wrap) return;

const row=document.createElement('div');
row.className='plan-row';

row.innerHTML=`
<input placeholder="Nome do plano ex: 30 Dias" value="${data.name||''}">
<input placeholder="Duração ex: 30 dias" value="${data.days||''}">
<input placeholder="Preço antigo" value="${data.old_price||''}">
<input placeholder="Preço promocional" value="${data.price||''}">
<input placeholder="Desconto ex: -30%" value="${data.discount||''}">
<button type="button" onclick="this.parentElement.remove()">×</button>
`;

wrap.appendChild(row);
}

setTimeout(()=>{
if(document.getElementById('variation-container') && document.getElementById('variation-container').children.length===0){
addVariation();
}
},500);
</script>


<script>
function clearVariations(){const wrap=document.getElementById('variation-container');if(wrap)wrap.innerHTML='';}
function addVariation(data={}){
  const wrap=document.getElementById('variation-container');
  if(!wrap)return;
  const row=document.createElement('div');
  row.className='plan-row';
  row.innerHTML=`
    <div class="field"><label>Nome do plano</label><input class="v-name" placeholder="Ex: 15 Dias / Mensal / Permanente" value="${data.name||''}"></div>
    <div class="field"><label>Duração</label><input class="v-days" placeholder="Ex: 15 dias / Vitalício" value="${data.days||''}"></div>
    <div class="field"><label>Preço antigo</label><input class="v-old" type="number" step="0.01" placeholder="Ex: 49.99" value="${data.old_price||''}"></div>
    <div class="field"><label>Preço atual</label><input class="v-price" type="number" step="0.01" placeholder="Ex: 35.00" value="${data.price||''}"></div>
    <div class="field"><label>Desconto</label><input class="v-discount" placeholder="Ex: -30%" value="${data.discount||''}"></div>
    <div class="remove-wrap"><button type="button" class="plan-remove">×</button></div>
  `;
  row.querySelector('.plan-remove').onclick=()=>row.remove();
  wrap.appendChild(row);
}
function collectVariations(){
  return [...document.querySelectorAll('#variation-container .plan-row')].map(row=>({
    name: row.querySelector('.v-name').value.trim(),
    days: row.querySelector('.v-days').value.trim(),
    old_price: Number(row.querySelector('.v-old').value||0),
    price: Number(row.querySelector('.v-price').value||0),
    discount: row.querySelector('.v-discount').value.trim()
  })).filter(p=>p.name || p.price);
}
document.addEventListener('DOMContentLoaded',()=>{
  const btn=document.getElementById('addVariationBtn');
  if(btn)btn.onclick=()=>addVariation();
  setTimeout(()=>{const wrap=document.getElementById('variation-container');if(wrap && !wrap.children.length)addVariation();},300);
});
</script>
</body></html>
