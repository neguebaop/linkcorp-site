<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin - Link Corp</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-plans-box{border:1px solid rgba(255,49,49,.45);border-radius:16px;padding:14px;background:rgba(10,17,29,.55)}
    .admin-plan-row{border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px;margin-bottom:12px;background:#111a29}
    .admin-plan-grid{display:grid;grid-template-columns:1.2fr 1fr .8fr .8fr .7fr auto;gap:10px;align-items:center}
    .plan-remove{border:1px solid rgba(255,49,49,.7);background:transparent;color:#ff3131;border-radius:10px;padding:12px;cursor:pointer;font-weight:900}
    .admin-actions{display:flex;gap:10px;flex-wrap:wrap}
    .hint{color:#9aa4b5;font-size:13px;line-height:1.4}
    .table img{width:62px;height:45px;object-fit:cover;border-radius:8px}
    @media(max-width:900px){.admin-plan-grid{grid-template-columns:1fr}.plan-remove{width:100%}}
  </style>
</head>
<body>
<div id="nav"></div>

<main class="section container">
  <h1 class="title">PAINEL <span class="glow">ADMIN</span></h1>

  <div id="loginAdmin" class="card" style="max-width:520px;margin:auto">
    <h2>Entrar como admin</h2>
    <form id="adminLogin" class="form">
      <input class="input" type="email" name="email" placeholder="Email admin">
      <input class="input" type="password" name="password" placeholder="Senha">
      <button class="btn">Entrar</button>
    </form>
  </div>

  <div id="adminArea" style="display:none">
    <div class="admin-layout">
      <div class="card">
        <h2 id="formTitle">Cadastrar produto</h2>

        <form id="productForm" class="form">
          <input type="hidden" name="id">

          <select name="category" required>
            <option value="android">Android</option>
            <option value="ios">iOS</option>
            <option value="pc">PC</option>
          </select>

          <input class="input" name="name" placeholder="Nome do produto" required>
          <textarea name="description" placeholder="Descrição do produto"></textarea>
          <input class="input" name="badge" placeholder="Selo ex: Mais escolhido">
          <input class="input" name="image_url" placeholder="URL da imagem ou envie arquivo abaixo">
          <input class="input" name="image_file" type="file" accept="image/*">

          <div class="admin-plans-box">
            <h3>Variações / Planos</h3>
            <p class="hint">Cadastre vários planos igual Eremby: 15 dias, 30 dias, 90 dias, Permanente etc. O primeiro plano será usado como preço principal no card.</p>

            <div id="plansEditor"></div>

            <button type="button" class="btn ghost" onclick="addPlanRow()">+ Adicionar plano</button>
          </div>

          <div class="admin-actions">
            <button class="btn" type="submit">Salvar produto</button>
            <button type="button" class="btn ghost" onclick="clearProductForm()">Limpar</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>Produtos cadastrados</h2>
        <div style="overflow:auto">
          <table class="table">
            <thead>
              <tr>
                <th>Imagem</th>
                <th>Nome</th>
                <th>Categoria</th>
                <th>Planos</th>
                <th>Preço inicial</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="productsTable"></tbody>
          </table>
        </div>

        <h2>Pedidos</h2>
        <div id="orders"></div>
      </div>
    </div>
  </div>
</main>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>

<script>
boot('login');

let allProducts = [];

function emptyPlan(){
  return {name:'', days:'', old_price:'', price:'', discount:''};
}

function addPlanRow(plan = emptyPlan()){
  const box = document.getElementById('plansEditor');
  const div = document.createElement('div');
  div.className = 'admin-plan-row';
  div.innerHTML = `
    <div class="admin-plan-grid">
      <input class="input plan-name" placeholder="Nome: 15 Dias / Mensal / Permanente" value="${escapeAttr(plan.name || '')}">
      <input class="input plan-days" placeholder="Duração: 15 dias / Vitalício" value="${escapeAttr(plan.days || '')}">
      <input class="input plan-old" type="number" step="0.01" placeholder="Preço antigo" value="${escapeAttr(plan.old_price ?? '')}">
      <input class="input plan-price" type="number" step="0.01" placeholder="Preço atual" value="${escapeAttr(plan.price ?? '')}">
      <input class="input plan-discount" placeholder="Desconto: -30%" value="${escapeAttr(plan.discount || '')}">
      <button type="button" class="plan-remove" onclick="this.closest('.admin-plan-row').remove()">X</button>
    </div>
  `;
  box.appendChild(div);
}

function escapeAttr(v){
  return String(v).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;');
}

function collectPlans(){
  const rows = [...document.querySelectorAll('.admin-plan-row')];
  const plans = rows.map(row => ({
    name: row.querySelector('.plan-name').value.trim(),
    days: row.querySelector('.plan-days').value.trim(),
    old_price: Number(row.querySelector('.plan-old').value || 0),
    price: Number(row.querySelector('.plan-price').value || 0),
    discount: row.querySelector('.plan-discount').value.trim()
  })).filter(p => p.name || p.price);

  if(!plans.length){
    throw new Error('Adicione pelo menos 1 plano.');
  }

  return plans;
}

function setPlans(plans){
  const box = document.getElementById('plansEditor');
  box.innerHTML = '';
  if(Array.isArray(plans) && plans.length){
    plans.forEach(p => addPlanRow(p));
  }else{
    addPlanRow({name:'15 Dias', days:'15 dias', old_price:'49.99', price:'35', discount:'-30%'});
    addPlanRow({name:'Mensal', days:'30 dias', old_price:'99.99', price:'65', discount:'-35%'});
    addPlanRow({name:'Permanente', days:'Vitalício', old_price:'179.99', price:'120', discount:'-33%'});
  }
}

function clearProductForm(){
  document.getElementById('productForm').reset();
  document.querySelector('[name=id]').value = '';
  document.getElementById('formTitle').textContent = 'Cadastrar produto';
  setPlans([]);
}

async function check(){
  let s = await getSession();
  if(s && isAdminEmail(s.user.email)){
    document.getElementById('loginAdmin').style.display='none';
    document.getElementById('adminArea').style.display='block';
    loadAdmin();
  }else if(s){
    toast('Seu email não está em ADMIN_EMAILS no config.js');
  }
}

check();

document.getElementById('adminLogin').onsubmit = async e => {
  e.preventDefault();
  let fd = new FormData(e.target);
  let {error} = await supabase.auth.signInWithPassword({
    email: fd.get('email'),
    password: fd.get('password')
  });
  if(error) return toast(error.message);
  check();
};

async function loadAdmin(){
  if(!isConfigured()) return toast('Configure o Supabase primeiro.');

  let {data,error} = await supabase
    .from('products')
    .select('*')
    .order('created_at',{ascending:false});

  if(error) return toast(error.message);

  allProducts = data || [];

  document.getElementById('productsTable').innerHTML = allProducts.map(p => {
    const plans = Array.isArray(p.plans) ? p.plans : [];
    const first = plans[0] || {price:p.price};
    return `
      <tr>
        <td><img src="${p.image_url || 'assets/logo.png'}"></td>
        <td>${p.name}</td>
        <td>${p.category}</td>
        <td>${plans.length} plano(s)</td>
        <td>${money(first.price || p.price)}</td>
        <td>
          <button class="tab" onclick="editProduct('${p.id}')">Editar</button>
          <button class="tab" onclick="delProduct('${p.id}')">Apagar</button>
        </td>
      </tr>
    `;
  }).join('');

  let r = await supabase
    .from('orders')
    .select('*')
    .order('created_at',{ascending:false})
    .limit(20);

  document.getElementById('orders').innerHTML = (r.data || []).map(o => `
    <div class="plan">
      <b>${o.customer_name}</b>
      <span>${o.whatsapp || o.discord || 'Discord não informado'}</span>
      <b>${money(o.total)}</b>
      <small>${o.status}</small>
    </div>
  `).join('') || '<p>Nenhum pedido.</p>';
}

document.getElementById('productForm').onsubmit = async e => {
  e.preventDefault();

  let fd = new FormData(e.target);
  let image = fd.get('image_url');
  let file = fd.get('image_file');

  try{
    if(file && file.size) image = await uploadImage(file);

    const plans = collectPlans();
    const first = plans[0];

    let product = {
      category: fd.get('category'),
      name: fd.get('name'),
      description: fd.get('description'),
      badge: fd.get('badge'),
      old_price: Number(first.old_price || 0),
      price: Number(first.price || 0),
      image_url: image,
      plans: plans,
      active: true
    };

    let id = fd.get('id');

    let res = id
      ? await supabase.from('products').update(product).eq('id', id)
      : await supabase.from('products').insert(product);

    if(res.error) return toast(res.error.message);

    toast('Produto salvo com planos!');
    clearProductForm();
    loadAdmin();
  }catch(err){
    toast(err.message);
  }
};

function editProduct(id){
  let p = allProducts.find(x => String(x.id) === String(id));
  if(!p) return toast('Produto não encontrado.');

  let f = document.getElementById('productForm');
  f.id.value = p.id;
  f.category.value = p.category || 'android';
  f.name.value = p.name || '';
  f.description.value = p.description || '';
  f.badge.value = p.badge || '';
  f.image_url.value = p.image_url || '';
  setPlans(p.plans || []);

  document.getElementById('formTitle').textContent = 'Editando produto';
  scrollTo({top:0,behavior:'smooth'});
}

async function delProduct(id){
  if(!confirm('Apagar produto?')) return;
  let {error} = await supabase.from('products').delete().eq('id',id);
  if(error) return toast(error.message);
  loadAdmin();
}

setPlans([]);
</script>
</body>
</html>
